site_name: GyroidOS
site_url: https://www.gyroidos.io/
site_description: >-
  GyroidOS is a multi-arch, open-source OS-level virtualization solution with a
  focus on platform security based on hardware features. Built with Linux and Yocto.

repo_url: https://github.com/gyroidos
repo_name: gyroidos

theme:
  name: material
  # Extends the footer copyright line with Imprint and Privacy Policy links
  custom_dir: overrides
  logo: assets/gyroidos-logo.svg
  favicon: assets/gyroidos-logo-small.png
  # No Google Fonts — the theme falls back to the system font stack
  font: false
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - About: "/#what-is-gyroidos"
  - Architecture: "/#architecture"
  - Features: "/#key-features"
  - Platforms: "/#supported-platforms"
  - Get Started: "/#get-started-in-three-steps"
  - Resources: "/#resources"
  - Documentation: https://gyroidos.github.io/

# Intentional nav layout, silence the corresponding notices:
# - the tabs link to sections of the landing page via absolute anchors (/#...)
# - privacy_policy.md and publications.md are reached through in-page links,
#   not through the nav
validation:
  nav:
    absolute_links: ignore
    omitted_files: ignore

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/reveal.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gyroidos
      name: GyroidOS on GitHub
    - icon: fontawesome/solid/envelope
      link: mailto:gyroidos@aisec.fraunhofer.de
      name: Contact the team

copyright: >-
  Copyright &copy; 2026 Fraunhofer AISEC
